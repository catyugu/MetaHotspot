name: Format PR 94
on:
  push:
    branches:
      - refactor/shared-compiled-laws-and-initial-state
    paths:
      - .github/workflows/format-pr94.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shared-compiled-laws-and-initial-state
      - run: python -m pip install clang-format==23.1.3 ruff==0.17.1
      - name: Format
        run: |
          find src include tests apps -type f \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) -print0 | xargs -0 clang-format -i
          ruff format python .github/scripts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src include tests apps python .github/scripts
          if ! git diff --cached --quiet; then
            git commit -m "style: apply repository formatters"
            git push origin HEAD:refactor/shared-compiled-laws-and-initial-state
          fi
