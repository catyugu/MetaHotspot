name: BCI resolvent design experiments
on:
  push:
    branches: [agent/bci-resolvent-design-20260919]
    paths:
      - playground/bci_resolvent_design/**
      - .github/workflows/bci-resolvent-design.yml
      - '!playground/bci_resolvent_design/RESULTS.md'
  workflow_dispatch:
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      scientific: ${{ steps.detect.outputs.scientific }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Isolated existing dependency versions
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/python" -m pip install numpy==2.5.3 scipy==1.18.1 pyamg==5.3.0 pytest==9.1.1
          "$RUNNER_TEMP/venv/bin/python" -m pip install -e python
      - name: Unchanged native build and regressions
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/audit"
          cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Release 2>&1 | tee "$RUNNER_TEMP/audit/configure.log"
          cmake --build build --parallel 2 2>&1 | tee "$RUNNER_TEMP/audit/build.log"
          python run_tests.py 2>&1 | tee "$RUNNER_TEMP/audit/native-tests.log"
          python run_cases.py 2>&1 | tee "$RUNNER_TEMP/audit/cases.log"
          python -m pytest python/tests -v 2>&1 | tee "$RUNNER_TEMP/audit/python-tests.log"
      - name: Original native Case1 and exact stock BCI baseline
        shell: bash
        run: |
          python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/audit/stock-baseline.log"
          import os, sys, json, hashlib
          from pathlib import Path
          import numpy as np
          import scipy.sparse as sp
          sys.path.insert(0, 'playground/bci_rom_testcase1')
          from model_case1 import Case1Model, Case1Config
          from metahotspot.macromodel import utils as u
          out=Path(os.environ['RUNNER_TEMP'])/'audit'
          for mesh in (5.0, 2.5, 1.0):
              model=Case1Model(Case1Config(max_xy_cell_mm=mesh,max_z_cell_mm=mesh))
              K,C,G,H=model.core.K,model.core.C,model.source_shape,model.boundary_terms
              stem=out/('case1_'+str(mesh)); stem.mkdir()
              sp.save_npz(stem/'K.npz',K); sp.save_npz(stem/'C.npz',C)
              for j,term in enumerate(H): sp.save_npz(stem/f'H{j}.npz',term)
              ratios=[]
              for group,axis in zip(model.boundary_groups(),model._boundary_axis_per_group()):
                  cells=group.cells
                  ratio=model.cell_layout.half_sizes[cells,axis]/model.cell_layout.conductivity[cells,axis]
                  assert np.ptp(ratio)<1e-12
                  ratios.append(float(ratio[0]))
              np.savez(stem/'data.npz',G=G,power=model.nominal_power(),ranges=model.h_ranges(),centers=model.cell_layout.centers,physical_ranges=np.array([g.h_range for g in model.boundary_groups()]),half_over_k=ratios)
              (stem/'hashes.json').write_text(json.dumps({p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in stem.glob('*.npz')},indent=2))
              if mesh==5.0:
                  V,summary=u.build_parametric_basis(model.core,G,H,model.h_ranges(),tolerance=1e-3,max_order=1024,probe_rounds=10,seed=20260805)
                  cp,k0,f,fb,ab=u.project_bci(model.core,G,H,V)
                  kr=u.assemble_reduced_k(k0,fb,ab,model.physical_to_effective((50.,1000.)))
                  x=u.solve_rom_steady(kr,f,model.nominal_power())
                  ref=model.full_reference((50.,1000.)).steady_temperature-model.ambient_K
                  summary['steady_fullfield_relative_error']=float(np.max(np.abs(V@x-ref))/np.max(np.abs(ref)))
                  summary['n']=K.shape[0]
                  (out/'stock-baseline.json').write_text(json.dumps(summary,indent=2))
                  print(json.dumps(summary),flush=True)
          PY
      - name: Tests after candidate implementation is present
        id: detect
        shell: bash
        run: |
          if test -f playground/bci_resolvent_design/run.py; then
            python -m unittest discover -s playground/bci_resolvent_design -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/audit/new-tests.log"
            echo 'scientific=true' >> "$GITHUB_OUTPUT"
          else
            echo 'scientific=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Audit preserved repository
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/audit"
          git diff --check 0b4e5874d27571488d62568d12b7a68df7656aca...HEAD
          git diff --exit-code 0b4e5874d27571488d62568d12b7a68df7656aca HEAD -- src include python tests cmake CMakeLists.txt playground/bci_rom_testcase1 playground/connecting_mor_models
          git diff --exit-code
          git status --short > "$RUNNER_TEMP/audit/git-status.txt"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD > "$RUNNER_TEMP/audit/head-sha.txt"
          git archive HEAD | gzip > "$RUNNER_TEMP/audit/source.tar.gz"
          python -m pip freeze > "$RUNNER_TEMP/audit/freeze.txt"
          lscpu > "$RUNNER_TEMP/audit/cpu.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bci-resolvent-native
          path: ${{ runner.temp }}/audit/
          retention-days: 30
  study:
    needs: baseline
    if: needs.baseline.outputs.scientific == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        seed: [20261301,20261302,20261303]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bci-resolvent-native
          path: ${{ runner.temp }}/native
      - name: Compare against actual stock BCI FANTASTIC
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          source "$RUNNER_TEMP/venv/bin/activate"
          python -m pip install numpy==2.5.3 scipy==1.18.1 pyamg==5.3.0
          python -m pip install -e python
          mkdir -p "$RUNNER_TEMP/study"
          python -m pip freeze > "$RUNNER_TEMP/study/freeze.txt"
          lscpu > "$RUNNER_TEMP/study/cpu.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/study/head-sha.txt"
          git archive HEAD | gzip > "$RUNNER_TEMP/study/source.tar.gz"
          python playground/bci_resolvent_design/run.py --native "$RUNNER_TEMP/native" --seed ${{ matrix.seed }} --followup --output "$RUNNER_TEMP/study" 2>&1 | tee "$RUNNER_TEMP/study/run.log"
      - name: Final worktree checks
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/study"
          git diff --check 0b4e5874d27571488d62568d12b7a68df7656aca...HEAD
          git diff --exit-code
          git status --short > "$RUNNER_TEMP/study/git-status.txt"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bci-resolvent-study-${{ matrix.seed }}
          path: ${{ runner.temp }}/study/
          retention-days: 30
