name: Publish Ubuntu CI image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "New GHCR image tag, e.g. ubuntu24.04-v1"
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/ubuntu-ci.Dockerfile
          push: true
          tags: ghcr.io/catyugu/metahotspot-ci:${{ inputs.tag }}
