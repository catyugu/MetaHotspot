name: Autofix

on:
  workflow_call:
    secrets:
      AUTOFIX_TOKEN:
        required: true

permissions:
  contents: read
  packages: read

jobs:
  fix:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/catyugu/metahotspot-ci:ubuntu24.04-18975036af24574f
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python -m pip install --group dev
      - uses: ./.github/actions/autofix-lint
        with:
          fix: "true"
      - name: Commit and push fixes
        shell: bash
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          AUTOFIX_TOKEN: ${{ secrets.AUTOFIX_TOKEN }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git add -u -- src include tests apps python .github/scripts
          if git diff --cached --quiet; then
            echo "::error::No automatic fixes available; resolve the lint errors manually."
            exit 1
          fi
          : "${AUTOFIX_TOKEN:?AUTOFIX_TOKEN secret is required}"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "style: apply automatic formatting"
          auth=$(printf 'x-access-token:%s' "$AUTOFIX_TOKEN" | base64 -w0)
          printf '::add-mask::%s\n' "$auth"
          # A PAT push triggers CI for the new commit; never overwrite newer commits.
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$BRANCH"
