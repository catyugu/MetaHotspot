name: BCI state-space geometry studies
on:
  push:
    branches: [agent/bci-state-geometry-20260919]
    paths:
      - playground/bci_state_geometry/**
      - .github/workflows/bci-state-geometry.yml
      - '!playground/bci_state_geometry/RESULTS.md'
  workflow_dispatch:
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      scientific: ${{ steps.detect.outputs.scientific }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Isolated existing dependency versions
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/python" -m pip install numpy==2.5.3 scipy==1.18.1 pyamg==5.3.0 pytest==9.1.1
          "$RUNNER_TEMP/venv/bin/python" -m pip install -e python
      - name: Unmodified documented native regressions
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/audit"
          cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Release 2>&1 | tee "$RUNNER_TEMP/audit/configure.log"
          cmake --build build --parallel 2 2>&1 | tee "$RUNNER_TEMP/audit/build.log"
          python run_tests.py 2>&1 | tee "$RUNNER_TEMP/audit/native-tests.log"
          python run_cases.py 2>&1 | tee "$RUNNER_TEMP/audit/cases.log"
          python -m pytest python/tests -v 2>&1 | tee "$RUNNER_TEMP/audit/python-tests.log"
      - name: Original Case1 matrices and unchanged BCI FANTASTIC
        shell: bash
        run: |
          python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/audit/baseline.log"
          import os, sys, json, time
          from pathlib import Path
          import numpy as np
          import scipy.sparse as sp
          sys.path.insert(0, 'playground/bci_rom_testcase1')
          from model_case1 import Case1Model, Case1Config
          from metahotspot.macromodel import utils as u
          out=Path(os.environ['RUNNER_TEMP'])/'audit'
          for mesh in (5.0,2.5,1.0):
              model=Case1Model(Case1Config(max_xy_cell_mm=mesh,max_z_cell_mm=mesh))
              K,C,G=model.core.K,model.core.C,model.source_shape
              H=model.boundary_terms
              stem=out/('case1_'+str(mesh)); stem.mkdir()
              sp.save_npz(stem/'K.npz',K); sp.save_npz(stem/'C.npz',C)
              for j,h in enumerate(H): sp.save_npz(stem/f'H{j}.npz',h)
              groups=model.boundary_groups(); axes=model._boundary_axis_per_group(); ratios=[]
              for group,axis in zip(groups,axes):
                  cells=group.cells
                  ratio=model.cell_layout.half_sizes[cells,axis]/model.cell_layout.conductivity[cells,axis]
                  assert np.ptp(ratio)<1e-12
                  ratios.append(float(ratio[0]))
              np.savez(stem/'data.npz',G=G,power=model.nominal_power(),ranges=model.h_ranges(),centers=model.cell_layout.centers,physical_ranges=np.array([g.h_range for g in groups]),half_over_k=ratios)
              if mesh==5.0:
                  t=time.perf_counter()
                  V,summary=u.build_parametric_basis(model.core,G,H,model.h_ranges(),tolerance=1e-3,max_order=u.MAX_ORDER,probe_rounds=10,seed=20260805)
                  summary['wall_seconds']=time.perf_counter()-t
                  cp,k0,f,fb,ab=u.project_bci(model.core,G,H,V,boundary_epsilon=1e-3)
                  kr=u.assemble_reduced_k(k0,fb,ab,model.physical_to_effective((50.,1000.)))
                  x=u.solve_rom_steady(kr,f,model.nominal_power())
                  ref=model.full_reference((50.,1000.)).steady_temperature-model.ambient_K
                  summary['steady_field_relative']=float(np.max(np.abs(V@x-ref))/np.max(np.abs(ref)))
                  summary['n']=K.shape[0]
                  (out/'stock-baseline.json').write_text(json.dumps(summary,indent=2)); print(json.dumps(summary),flush=True)
          PY
      - name: Targeted algebra tests when present
        id: detect
        shell: bash
        run: |
          if test -f playground/bci_state_geometry/run.py; then
            python -m unittest discover -s playground/bci_state_geometry -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/audit/new-tests.log"
            echo 'scientific=true' >> "$GITHUB_OUTPUT"
          else
            echo 'scientific=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Audit unchanged source and worktree
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/audit"
          git diff --check 0b4e5874d27571488d62568d12b7a68df7656aca...HEAD
          git diff --exit-code 0b4e5874d27571488d62568d12b7a68df7656aca HEAD -- src include python tests cmake CMakeLists.txt playground/bci_rom_testcase1 playground/connecting_mor_models
          git diff --exit-code
          git status --short > "$RUNNER_TEMP/audit/git-status.txt"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD > "$RUNNER_TEMP/audit/head-sha.txt"
          git archive HEAD | gzip > "$RUNNER_TEMP/audit/source.tar.gz"
          python -m pip freeze > "$RUNNER_TEMP/audit/freeze.txt"
          lscpu > "$RUNNER_TEMP/audit/cpu.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bci-state-native
          path: ${{ runner.temp }}/audit/
          retention-days: 30
  experiment:
    needs: baseline
    if: needs.baseline.outputs.scientific == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seed: [20261201, 20261202, 20261203]
        ports: [4, 16]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bci-state-native
          path: ${{ runner.temp }}/native
      - name: Isolated existing numerical dependencies
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/python" -m pip install numpy==2.5.3 scipy==1.18.1 pyamg==5.3.0
          "$RUNNER_TEMP/venv/bin/python" -m pip install -e python
      - name: Matched BCI research experiment
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/audit"
          git rev-parse HEAD > "$RUNNER_TEMP/audit/head-sha.txt"
          git archive HEAD | gzip > "$RUNNER_TEMP/audit/source.tar.gz"
          python -m pip freeze > "$RUNNER_TEMP/audit/freeze.txt"
          lscpu > "$RUNNER_TEMP/audit/cpu.txt"
          python playground/bci_state_geometry/run.py --data "$RUNNER_TEMP/native/case1_2.5" --ports ${{ matrix.ports }} --seed ${{ matrix.seed }} --output "$RUNNER_TEMP/audit/results" 2>&1 | tee "$RUNNER_TEMP/audit/run.log"
      - name: Audit unchanged production and worktree
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/audit"
          git diff --check 0b4e5874d27571488d62568d12b7a68df7656aca...HEAD
          git diff --exit-code 0b4e5874d27571488d62568d12b7a68df7656aca HEAD -- src include python tests cmake CMakeLists.txt playground/bci_rom_testcase1 playground/connecting_mor_models
          git diff --exit-code
          git status --short > "$RUNNER_TEMP/audit/git-status.txt"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bci-state-${{ matrix.ports }}-${{ matrix.seed }}
          path: ${{ runner.temp }}/audit/
          retention-days: 30
