name: Build and package
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, dev, agent/dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              os: ubuntu-latest,
              cc: gcc,
              cxx: g++,
              config: Release,
              generator: Ninja,
              label: linux-gcc,
            }
          - {
              os: ubuntu-latest,
              cc: clang-18,
              cxx: clang++-18,
              config: Debug,
              generator: Ninja,
              label: linux-clang,
            }
          - {
              os: ubuntu-latest,
              cc: clang-18,
              cxx: clang++-18,
              config: Debug,
              generator: Ninja,
              label: linux-sanitize,
              extra: "--cmake-arg=-DMHS_SANITIZE=ON",
            }
          - {
              os: macos-latest,
              cc: clang,
              cxx: clang++,
              config: Release,
              generator: Ninja,
              label: macos-clang,
            }
          - {
              os: windows-latest,
              cc: cl,
              cxx: cl,
              config: Release,
              generator: Ninja,
              label: windows-msvc,
            }
          - {
              os: windows-latest,
              cc: clang-cl,
              cxx: clang-cl,
              config: Release,
              generator: Ninja,
              label: windows-clang,
            }
          - {
              os: windows-2022,
              cc: cl,
              cxx: cl,
              config: Debug,
              generator: "Visual Studio 17 2022",
              label: windows-multiconfig,
            }
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: python -m pip install 'cmake>=3.30' ninja
      - if: runner.os == 'Windows' && matrix.config == 'Release'
        run: python -m pip install pefile
      - if: matrix.cxx == 'clang++-18'
        run: sudo apt-get update && sudo apt-get install -y clang-18 libomp-18-dev
      - if: runner.os == 'macOS'
        run: |
          brew install libomp
          echo "OpenMP_ROOT=$(brew --prefix libomp)" >> "$GITHUB_ENV"
      # Configure fetches every dependency over the network, so a run that keeps
      # no copy pays the whole clone cost in all seven jobs.
      - uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: cpm-${{ runner.os }}-
      - name: Check source formatting and lint
        if: matrix.label == 'linux-gcc'
        shell: bash
        run: |
          python -m pip install --group dev
          find src include tests -type f \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) -print0 | xargs -0 clang-format --dry-run --Werror
          ruff check python .github/scripts
          ruff format --check python .github/scripts
      - run: python .github/scripts/check_build.py --config ${{ matrix.config }} --generator "${{ matrix.generator }}" ${{ matrix.extra }}
      - if: runner.os == 'Windows' && matrix.config == 'Release'
        shell: pwsh
        run: |
          $archive = (Get-ChildItem build/MetaHotspot-*.zip).FullName
          python .github/scripts/check_wheel.py --sdk $archive
      # Actions artifacts are already ZIP archives. Upload the installed SDK
      # files directly so downloads do not contain another CPack ZIP.
      - uses: actions/upload-artifact@v7
        if: matrix.config == 'Release'
        with:
          name: MetaHotspot-${{ matrix.label }}-${{ matrix.config }}
          path: build/package/
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.label }}-${{ matrix.config }}
          path: |
            build/**/CMakeFiles/CMakeConfigureLog.yaml
            build/**/CMakeFiles/CMakeError.log
            build/**/Testing/Temporary/*
          if-no-files-found: ignore

  # Build each py3-none wheel once. Linux uses a fixed glibc baseline;
  # Windows and macOS build natively. No release publishing is added here.
  wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
    steps:
      - uses: actions/checkout@v7
      - if: runner.os != 'Linux'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - if: runner.os == 'Linux'
        run: echo "/opt/python/cp312-cp312/bin" >> "$GITHUB_PATH"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: python -m pip install build 'cmake>=3.30' ninja
      - if: runner.os == 'Linux'
        run: python -m pip install auditwheel patchelf
      - if: runner.os == 'Windows'
        run: python -m pip install delvewheel pefile
      - if: runner.os == 'macOS'
        run: python -m pip install delocate
      - if: runner.os == 'macOS'
        uses: ./.github/actions/setup-macos-openmp
      - uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: cpm-${{ runner.os }}-
      - run: python .github/scripts/check_python.py --build-only
      # Hide the source of the bundled runtime before any installed-wheel test.
      - if: runner.os == 'macOS'
        run: mv "$OpenMP_ROOT" "$OpenMP_ROOT.hidden"
      - name: Exercise baseline wheel with bundled runtime
        if: runner.os != 'Windows'
        shell: bash
        env:
          OMP_NUM_THREADS: "2"
        run: |
          python -m pip install wheelhouse/*.whl
          python .github/scripts/wheel_smoke.py native-first
      - uses: actions/upload-artifact@v7
        with:
          name: MetaHotspot-wheel-${{ runner.os }}
          path: |
            wheelhouse/*.whl
            dist/*.tar.gz

  # Separate runners have no build tree or development OpenMP setup. The same
  # artifact is tested at both ends of the supported CPython range.
  python:
    needs: wheel
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: MetaHotspot-wheel-${{ runner.os }}
      - run: python -m pip install pytest
      - name: Test installed wheel without compiler setup
        shell: bash
        run: |
          python .github/scripts/check_python.py --wheel wheelhouse/*.whl
