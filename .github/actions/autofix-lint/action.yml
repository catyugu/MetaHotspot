name: Autofix and lint
description: Format same-repository pull requests and check C++/Python style
runs:
  using: composite
  steps:
    - shell: bash
      run: python -m pip install --group dev
    - name: Apply fixes
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      shell: bash
      env:
        BRANCH: ${{ github.head_ref }}
      run: |
        find src include tests apps -type f \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) -print0 | xargs -0 clang-format -i
        ruff check --fix-only python .github/scripts
        ruff format python .github/scripts
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git add -u -- src include tests apps python .github/scripts
        if ! git diff --cached --quiet; then
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "style: apply automatic formatting"
          git push origin "HEAD:refs/heads/$BRANCH"
        fi
    - name: Check formatting and lint
      shell: bash
      run: |
        find src include tests apps -type f \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) -print0 | xargs -0 clang-format --dry-run --Werror
        ruff check python .github/scripts
        ruff format --check python .github/scripts
