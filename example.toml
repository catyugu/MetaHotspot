# ============================================================
#  Thermal-Fluidic Simulation Input File Example
#  Units: SI (m, s, K, W, kg)
#  This example is only for demonstration purposes and may not represent a realistic scenario.
#  For real application, this shall be converted automatically from other configurations.
# ============================================================

# --- Simulation Type & Time Settings ---
# "steady": average workload over cycles, No C matrix
# "transient": requires time parameters below
simulation_type = "steady"
time = 10                  # [transient only] total simulation time (s)
timestep = 0.1             # [transient only] time step size (s)
sampling_intvl = 0.01      # [transient only] power trace sampling interval (s)
proc_freq = 3.0e+9         # [transient only] base processor frequency (Hz)

ptrace_file_path = "gcc.ptrace"

# --- Initial Conditions (transient only) ---
init_temperature = 293.15               # uniform initial temperature (K)
init_temperature_file_path = "gcc.init" # overrides init_temperature if present

# --- Material Library (SI units) ---
[materials.silicon]
k = 130.0
cp = 1.63e+6
fluid = false

[materials.copper]
k = 400.0
cp = 3.44e+6
fluid = false

[materials.water]
k = 0.6
cp = 4.2e+6
dynamic_viscosity = 8.89e-4 # For fluid only.
fluid = true

# --- Domain Material Assignment ---
# Later assignments overwrite earlier ones for the same domain.
# Unassigned domains default to insulated solid.
[domain_material_assignment]
silicon = [1, 2, 5, 7]
copper = [1, 3, 6]     # Domain 1 becomes copper (overwrites silicon)
water = [4, 8]

# --- Boundary Conditions (self-contained with selection) ---
# Unassigned exterior boundaries:
#   - thermal: adiabatic (insulated)
#   - fluid–solid interface: no‑slip
#   - fluid boundary: zero‑pressure
[[boundary_conditions]]
name = "top_convection"
type = "convection"
h = 27132
T_inf = 318.15
selection = [1, 2, 3, 4, 5, 6]

[[boundary_conditions]]
name = "bottom_convection"
type = "convection"
h = 1000
T_inf = 318.15
selection = [15]

[[boundary_conditions]]
name = "fluid_temp"
type = "temperature"
T = 293.15
selection = [7]

[[boundary_conditions]]
name = "inlet_microchannel"
type = "inlet_velocity"
v = 10
selection = [7]

[[boundary_conditions]]
name = "outlet_microchannel"
type = "outlet_pressure"
p = 0
selection = [8]

[[boundary_conditions]]
name = "silicon_interface_resistance"
type = "interface_resistivity"
r = 0.007
selection = [9, 10, 11, 12]

[[boundary_conditions]]
name = "silicon_interface_capacity"
type = "interface_capitance"        # note: original spelling
c = 1630300
selection = [9, 10, 11, 12]

# NOTICE: When converting from the flp format, in which the x,y coordinates are based merely on the .flp layout geometry
# You shall map the coordinates to the global coordinate system. 
[[power_units]]
# Configure power units with geometry and material properties for thermal modeling.
# The name shall be aligned with the power trace file for automatic mapping.
name = "ALU"
material = "silicon" #Optional: overrides domain material for this power unit. If not specified, the material of the domain it belongs to will be used.
lx = 0.000
ly = 0.000
lz = 0.001
dx = 0.002
dy = 0.001
dz = 0.001

[[power_units]]
name = "FPU"
lx = 0.000
ly = 0.002
lz = 0.001
dx = 0.002
dy = 0.004
dz = 0.001

# --- Smart Components (Simplified Block Approximations) ---
# Override material properties for domains modelled as equivalent rectangular blocks.
[[smart_components]]
domain_id = 5
kx = 180.0    # in‑plane (W/m·K)
ky = 180.0    # in‑plane (W/m·K)
kz = 15.0     # through‑plane (W/m·K)
cp = 2.5e+6   # J/m³·K (ρ·cp)
