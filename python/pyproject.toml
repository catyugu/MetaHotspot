[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "metahotspot"
version = "0.1.0"
description = "MetaHotspot — thermal simulation C API Python bindings"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
]

[project.urls]
Homepage = "https://github.com/catyugu/MetaHotspot"

[tool.setuptools.packages.find]
include = ["metahotspot*"]

[tool.setuptools.package-data]
metahotspot = ["mhs_c_api.dll"]
